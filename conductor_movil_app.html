    function b64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function sha256Hex(texto) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(texto || '')));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function desenvolverConClave(hexCifrado, claveSecreta) {
      if (!hexCifrado) return '';
      const padHex = await sha256Hex('ECTOP_WRAP_V1|' + String(claveSecreta || '').trim());
      const bytes = [];
      for (let i = 0; i < hexCifrado.length; i += 2) {
        const cByte = parseInt(hexCifrado.substr(i, 2), 16);
        const kByte = parseInt(padHex.substr(((i / 2) * 2) % 60, 2), 16);
        bytes.push(cByte ^ kByte);
      }
      return new TextDecoder().decode(new Uint8Array(bytes));
    }

    async function obtenerEntidadesBovedaNube() {
      try {
        const res = await fetch(CLOUD_URL + "/rest/v1/ectop_sync_state?room_id=eq.boveda_licencias_empresas&select=payload", {
          headers: { "apikey": CLOUD_KEY, "Authorization": "Bearer " + CLOUD_KEY }
        });
        if (res.ok) {
          const rows = await res.json();
          if (Array.isArray(rows) && rows.length > 0 && rows[0].payload) {
            const p = rows[0].payload;
            return [
              ...(Array.isArray(p.licencias) ? p.licencias : []),
              ...(Array.isArray(p.empresasSeguridad) ? p.empresasSeguridad : [])
            ];
          }
        }
      } catch (e) {}
      return [];
    }

    function licenciaPermiteModulo(lic) {
      if (!lic || !lic.modulos || lic.modulos === 'AMBOS') return true;
      if (APP_SCOPE === 'ACCESO' && lic.modulos === 'LOGISTICA') return false;
      if (APP_SCOPE === 'LOGISTICA' && lic.modulos === 'ACCESO') return false;
      return true;
    }

    async function descifrarYAbrirConMasterSecret(masterSecret) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(masterSecret), { name: "PBKDF2" }, false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-CBC", length: 256 },
        false,
        ["decrypt"]
      );
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: "AES-CBC", iv: b64ToBytes(IV_B64) },
        key,
        b64ToBytes(CIPHER_B64)
      );
      const dec = new TextDecoder("utf-8");
      const html = dec.decode(decryptedBuf);
      document.open();
      document.write(html);
      document.close();
    }

    (async function verificarEquipoFijado() {
      try {
        const rawSaved = localStorage.getItem(STORAGE_KEY_BOVEDA);
        if (!rawSaved) return;
        const saved = JSON.parse(rawSaved);
        if (!saved || !saved.masterSecret) return;

        document.getElementById('tarjetaBovedaLogin').classList.add('hidden');
        document.getElementById('pantallaAutoUnlock').classList.remove('hidden');

        if (saved.esPropietario) {
          await descifrarYAbrirConMasterSecret(saved.masterSecret);
          return;
        }

        const entidades = await obtenerEntidadesBovedaNube();
        const encontrada = entidades.find(x => x.hashClave === saved.hashClave);
        if (encontrada && encontrada.estado === 'SUSPENDIDA') {
          localStorage.removeItem(STORAGE_KEY_BOVEDA);
          document.getElementById('pantallaAutoUnlock').classList.add('hidden');
          document.getElementById('tarjetaBovedaLogin').classList.remove('hidden');
          const err = document.getElementById('msgError');
          err.innerText = "⚠️ La suscripción de " + encontrada.empresa + " se encuentra SUSPENDIDA. Contacte a Eduardo Martínez (+56 9 5350 7453).";
          err.classList.remove('hidden');
          return;
        }
        if (encontrada && !licenciaPermiteModulo(encontrada)) {
          localStorage.removeItem(STORAGE_KEY_BOVEDA);
          document.getElementById('pantallaAutoUnlock').classList.add('hidden');
          document.getElementById('tarjetaBovedaLogin').classList.remove('hidden');
          const err = document.getElementById('msgError');
          err.innerText = "⚠️ La clave de " + encontrada.empresa + " no habilita este módulo (" + APP_SCOPE + ").";
          err.classList.remove('hidden');
          return;
        }
        await descifrarYAbrirConMasterSecret(saved.masterSecret);
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY_BOVEDA);
        document.getElementById('pantallaAutoUnlock').classList.add('hidden');
        document.getElementById('tarjetaBovedaLogin').classList.remove('hidden');
      }
    })();

    async function desbloquearBoveda(e) {
      e.preventDefault();
      const clave = document.getElementById('inpClave').value.trim();
      const fijar = document.getElementById('chkFijarEquipo').checked;
      const err = document.getElementById('msgError');
      const btn = document.getElementById('btnUnlock');
      err.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "⏳ VERIFICANDO SUSCRIPCIÓN Y DESCIFRANDO...";

      try {
        const hashIngresado = await sha256Hex('ECTOP_HASH_V1|' + clave);
        let masterSecret = '';
        let nombreEmpresa = 'PROPIETARIO E&C TOP';
        let tipoEntidad = 'PROPIETARIO';
        let esPropietario = false;

        if (hashIngresado === OWNER_HASH) {
          masterSecret = clave;
          esPropietario = true;
        } else {
          const entidades = await obtenerEntidadesBovedaNube();
          const encontrada = entidades.find(x => x.hashClave === hashIngresado);
          if (!encontrada) {
            throw new Error("CLAVE_INVALIDA");
          }
          if (encontrada.estado === 'SUSPENDIDA') {
            err.innerText = "⚠️ La suscripción de " + encontrada.empresa + " se encuentra SUSPENDIDA. Contacte a Eduardo Martínez (+56 9 5350 7453).";
            err.classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "🔓 Activar Bóveda en este Equipo y Entrar";
            return;
          }
          if (!licenciaPermiteModulo(encontrada)) {
            err.innerText = "⚠️ La clave de " + encontrada.empresa + " no incluye este módulo (" + APP_SCOPE + ").";
            err.classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "🔓 Activar Bóveda en este Equipo y Entrar";
            return;
          }
          masterSecret = await desenvolverConClave(encontrada.sobreCifrado, clave);
          nombreEmpresa = encontrada.empresa;
          tipoEntidad = encontrada.tipoEntidad || 'EMPRESA_CLIENTE';
        }

        if (fijar) {
          localStorage.setItem(STORAGE_KEY_BOVEDA, JSON.stringify({
            empresa: nombreEmpresa,
            tipoEntidad,
            hashClave: hashIngresado,
            masterSecret: masterSecret,
            esPropietario: esPropietario,
            ts: Date.now()
          }));
        }
        await descifrarYAbrirConMasterSecret(masterSecret);
      } catch (ex) {
        err.innerText = "❌ Contraseña de Bóveda no válida. Solicite la clave de su empresa a E&C TOP (+56 9 5350 7453).";
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "🔓 Activar Bóveda en este Equipo y Entrar";
      }
    }
